name: Deploy Logistics Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: letsellifytechnologieslimited/logistics-backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-deploy   # ✅ Ensures deploy runs only after build-and-deploy completes

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Log in to Docker Hub
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            
            # Navigate to the directory containing your docker-compose file
            cd backend/logistics

            # Pull the latest image
            docker compose -f logistics-compose.yaml pull   # ✅ Updated to use 'docker compose'

            # Restart the services
            docker compose -f logistics-compose.yaml up -d --remove-orphans  # ✅ Ensures old containers are removed
