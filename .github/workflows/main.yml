name: Deploy Logistics Backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t letsellifytechnologieslimited/logistics-backend:latest .

      - name: Push Docker image
        run: docker push letsellifytechnologieslimited/logistics-backend:latest

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH Connection to VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 SSH Connection Successful!"
            echo "GitHub Actions can access the VPS."
            echo "Current user: $(whoami)"
            echo "Current directory: $(pwd)"
            ls -lah /opt
