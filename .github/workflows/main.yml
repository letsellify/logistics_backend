name: Deploy Logistics Backend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Docker Image
        run: |
          docker build -t letsellifytechnologies/logistics-backend:latest .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Image to Docker Hub
        run: docker push letsellifytechnologieslimited/logistics-backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test SSH Connection to VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 SSH Connection Successful!"
            echo "GitHub Actions can access the VPS."
            echo "Current user: $(whoami)"
            echo "Current directory: $(pwd)"
            ls -lah /opt
