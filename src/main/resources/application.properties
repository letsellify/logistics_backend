# application name
spring.application.name=logistics

# flyway configurations
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=update

# Maximum file size per upload (e.g., 5MB)
spring.servlet.multipart.max-file-size=5MB

# Maximum total request size (if multiple files are uploaded together, e.g., 20MB)
spring.servlet.multipart.max-request-size=20MB


# enable virtual threads automatically for entire application
spring.threads.virtual.enabled=true


# Mail server configuration
spring.mail.host=smtp.mailgun.org
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
#spring.mail.protocol=smtp

# Optional default properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# security keys path
rsa.access-token.private-key=classpath:certs/access_token_private.pem
rsa.access-token.public-key=classpath:certs/access_token_public.pem
rsa.refresh-token.private-key=classpath:certs/refresh_token_private.pem
rsa.refresh-token.public-key=classpath:certs/refresh_token_public.pem


# Paystack configuration
paystack.base-url=${PAYSTACK_BASE_URL}
paystack.public-key=${PAYSTACK_PUBLIC_KEY}
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.payment-endpoint=${PAYSTACK_PAYMENT_ENDPOINT}
paystack.allowed-ips=${PAYSTACK_ALLOWED_IPS}

# S3 configuration
aws.s3.bucket-name=${S3_BUCKET_NAME}
aws.s3.region=us-east-1
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.presigned-url-expiration=3600


system.account.id=${SYSTEM_ACCOUNT_ID}



state-lga.json-file-path=classpath:data/nigerian-states.json


